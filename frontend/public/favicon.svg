<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Inner Border Gradient -->
    <linearGradient id="border-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>

    <!-- Stem Gradient (Electric Cyan/Blue) -->
    <linearGradient id="stem-gradient" x1="138" y1="392" x2="194" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Loop Gradient (Neon Violet/Pink) -->
    <linearGradient id="loop-gradient" x1="166" y1="312" x2="374" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Radial Gradient -->
    <radialGradient id="glow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Blur Filter -->
    <filter id="glow-blur" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="48" />
    </filter>

    <!-- Loop Drop Shadow -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="140" fill="url(#bg-gradient)" />
  
  <!-- Subtle Inner Border -->
  <rect x="1" y="1" width="510" height="510" rx="139" stroke="url(#border-gradient)" stroke-width="2.5" fill="none" />

  <!-- Soft Ambient Glow behind the P -->
  <circle cx="256" cy="256" r="180" fill="url(#glow-gradient)" filter="url(#glow-blur)" />

  <!-- Stem (Layer 1 - Back) -->
  <rect x="138" y="120" width="56" height="272" rx="28" fill="url(#stem-gradient)" />

  <!-- Loop (Layer 2 - Front, with Shadow and Inner Cutout) -->
  <path d="M 166 120 H 274 C 338 120, 374 155, 374 216 C 374 277, 338 312, 274 312 H 166 V 120 Z M 194 176 V 256 H 274 C 302 256, 318 240, 318 216 C 318 192, 302 176, 274 176 H 194 Z" 
        fill="url(#loop-gradient)" 
        filter="url(#drop-shadow)" 
        fill-rule="evenodd" />
</svg>